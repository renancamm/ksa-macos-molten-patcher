# Builds the mod and packages it as a zip. build.sh builds the files the *.replace patches
# install, following the "$ " lines in each patch.
#
# Runs only when started by hand: Actions tab -> Build -> Run workflow.
# The zip is attached to the run. Fill in "Release tag" to also publish a GitHub release.
#
# The build job runs third-party build code (MoltenVK's scripts), so it can only read the repo.
# Only the release job, which just uploads the finished zip, can write.

name: Build

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Release tag, e.g. v1.0.0 (empty = no release)"
        default: ""

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-latest
    timeout-minutes: 120

    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false   # don't leave the token where build code can read it

      # MoltenVK's fetchDependencies needs Python 3.11
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Build replacement files
        run: ./build.sh

      - name: Build the mod
        run: dotnet build -c Release -o out

      - name: Package
        run: |
          M=pkg/MacOSMoltenPatcher
          mkdir -p "$M"
          cp out/MacOSMoltenPatcher.dll out/mod.toml README.md "$M/"
          cp -R out/patches out/files out/licenses "$M/"
          (cd pkg && zip -r ../MacOSMoltenPatcher.zip MacOSMoltenPatcher)

      - uses: actions/upload-artifact@v4
        with:
          name: MacOSMoltenPatcher
          path: MacOSMoltenPatcher.zip

  release:
    needs: build
    if: inputs.release_tag != ''
    runs-on: ubuntu-latest
    permissions:
      contents: write   # needed to create releases

    steps:
      - uses: actions/download-artifact@v4
        with:
          name: MacOSMoltenPatcher

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.release_tag }}
        run: gh release create "$TAG" MacOSMoltenPatcher.zip --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --generate-notes
