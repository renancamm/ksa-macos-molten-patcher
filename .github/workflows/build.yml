# Builds the mod and packages it as a zip. build.sh builds the files the *.replace patches
# install, following the "$ " lines in each patch.
#
# Runs only when started by hand: Actions tab -> Build -> Run workflow.
# The zip is attached to the run. Fill in "Release tag" to also publish a GitHub release (from main only).
#
# The build job runs third-party build code (MoltenVK's scripts), so it can only read the repo.
# Only the release job, which just uploads the finished zip, can write.

name: Build

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Release tag, e.g. v1.0.0 (empty = no release)"
        default: ""

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-26
    timeout-minutes: 120

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false   # don't leave the token where build code can read it

      # MoltenVK's fetchDependencies needs Python 3.11
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"

      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          dotnet-version: "10.0.x"

      - name: Build replacement files
        run: ./build.sh

      - name: Build the mod folder
        run: dotnet build -c Release -o out/MacOSMoltenPatcher

      - name: Package
        run: cd out && zip -r ../MacOSMoltenPatcher.zip MacOSMoltenPatcher

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: MacOSMoltenPatcher
          path: MacOSMoltenPatcher.zip

  release:
    needs: build
    if: inputs.release_tag != '' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    permissions:
      contents: write   # needed to create releases

    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: MacOSMoltenPatcher

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.release_tag }}
        run: gh release create "$TAG" MacOSMoltenPatcher.zip --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --generate-notes --notes "sha256: $(sha256sum MacOSMoltenPatcher.zip | cut -d' ' -f1)"
